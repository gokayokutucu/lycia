name: Publish NuGet

on:
  push:
    # main and dev pushes run CI only; the publish job below runs exclusively for v* release tags.
    branches: [ main, dev ]
    tags: [ 'v*' ]
    # Deliberately no paths filter. GitHub applies a push trigger's paths filter to tag pushes as
    # well, and a newly created tag has no meaningful diff base, so a release tag can end up not
    # building - and therefore not publishing - depending on what its commit happened to touch.
    # Every main/dev push and v* tag therefore runs the full CI.
  # The minimum-version compatibility run is too slow to repeat on every push, so it also runs weekly and
  # on demand; a release tag always runs it (see the compatibility-minimum job).
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

# Least privilege by default. Only the publish job additionally gets id-token: write, which is what
# lets it mint the GitHub OIDC token that NuGet Trusted Publishing exchanges for a short-lived key.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (.NET Core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            6.0.x

      - name: Restore
        run: dotnet restore Lycia.sln

      - name: Build (Release)
        run: dotnet build Lycia.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Lycia.Tests/Lycia.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx"

      # In-memory ASP.NET Core TestServer only - no external infrastructure, so it runs alongside the
      # plain unit tests rather than in provider-tests or integration-tests.
      - name: Run ASP.NET Core diagnostics endpoint tests
        run: dotnet test tests/Lycia.Extensions.AspNetCore.Tests/Lycia.Extensions.AspNetCore.Tests.csproj -c Release --no-build --logger "trx;LogFileName=aspnetcore-diagnostics.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/unit.trx'

      - name: Publish ASP.NET Core diagnostics test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-diagnostics-test-results
          path: '**/aspnetcore-diagnostics.trx'

  integration-tests:
    name: Integration tests (.NET Core)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history + tags for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            6.0.x

      - name: Restore
        run: dotnet restore Lycia.sln

      - name: Build (Release)
        run: dotnet build Lycia.sln -c Release --no-restore

      # The suite starts its own RabbitMQ, Redis, NATS and Kafka containers (Testcontainers) from the images
      # pinned in infrastructure-versions.json - the "current" track. No service containers are declared here:
      # they were never used by the tests and would only hide which versions actually run.
      # Run per target framework with a distinct trx file name: a single multi-TFM invocation runs each
      # framework's test host sequentially but writes them all to the same default trx path, so the first
      # framework's result file is silently overwritten by the next one's - a real failure in an earlier
      # framework can vanish from the uploaded artifact even though the step's own exit code still reports
      # it. This is what hid the net10.0-only RabbitMqSagaCompensationIntegrationTests failure from the
      # integration-test-results artifact.
      - name: Run integration tests (current infrastructure versions, net9.0)
        run: dotnet test tests/Lycia.IntegrationTests/Lycia.IntegrationTests.csproj -c Release --no-build -f net9.0 --logger "trx;LogFileName=integration-net9.0.trx"

      # if: always() so a net9.0 failure (which would otherwise skip subsequent steps) never hides
      # net10.0's result too - the job still fails overall if either step fails.
      - name: Run integration tests (current infrastructure versions, net10.0)
        if: always()
        run: dotnet test tests/Lycia.IntegrationTests/Lycia.IntegrationTests.csproj -c Release --no-build -f net10.0 --logger "trx;LogFileName=integration-net10.0.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: '**/integration-net*.trx'

  provider-tests:
    name: Persistence provider tests (current infrastructure versions)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            6.0.x

      - name: Restore
        run: dotnet restore Lycia.sln

      - name: Build (Release)
        run: dotnet build Lycia.sln -c Release --no-restore

      # Redis, PostgreSQL and SQL Server containers come from infrastructure-versions.json ("current" track).
      - name: Run provider tests
        run: |
          for PROJECT in Lycia.Persistence.InMemory.Tests Lycia.Persistence.Redis.Tests Lycia.Persistence.PostgreSql.Tests Lycia.Persistence.SqlServer.Tests; do
            dotnet test "tests/$PROJECT/$PROJECT.csproj" -c Release --no-build --logger "trx;LogFileName=$PROJECT.trx"
          done

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-test-results
          path: '**/Lycia.Persistence.*.Tests.trx'

  compatibility-minimum:
    name: Minimum supported infrastructure versions
    runs-on: ubuntu-latest
    # Runs the same suites against the *minimum* versions in infrastructure-versions.json, which is what makes
    # "supported minimum" a tested claim. It repeats the container-backed suites with older images, so it is not
    # repeated on every push: it runs weekly, on demand, and always for a release tag (publish needs it).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    env:
      LYCIA_TEST_INFRA_TRACK: minimum
    steps:
      - name: Checkout (full history + tags for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            6.0.x

      - name: Restore
        run: dotnet restore Lycia.sln

      - name: Build (Release)
        run: dotnet build Lycia.sln -c Release --no-restore

      - name: Run suites against the minimum versions
        run: |
          for PROJECT in Lycia.Tests Lycia.Persistence.Redis.Tests Lycia.Persistence.PostgreSql.Tests Lycia.Persistence.SqlServer.Tests Lycia.IntegrationTests; do
            dotnet test "tests/$PROJECT/$PROJECT.csproj" -c Release --no-build --logger "trx;LogFileName=minimum-$PROJECT.trx"
          done

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-minimum-test-results
          path: '**/minimum-*.trx'

  unit-tests-netframework:
    name: Unit tests (NetFramework)
    runs-on: windows-latest

    steps:
      - name: Checkout (full history + tags for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            6.0.x

      - name: Setup Redis (Windows)
        run: |
          choco install memurai-developer -y
          Start-Service Memurai
          Start-Sleep -Seconds 5

      - name: Restore
        run: dotnet restore Lycia.sln

      - name: Build (Release)
        run: dotnet build Lycia.sln -c Release --no-restore

      - name: Run unit tests (NetFramework)
        env:
          CI: true
          LYCIA__EVENTSTORE__CONNECTIONSTRING: localhost:6379
        run: dotnet test tests/Lycia.Tests.NetFramework/Lycia.Tests.NetFramework.csproj -c Release --no-build --logger "trx;LogFileName=unit-netframework.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-netframework-test-results
          path: '**/unit-netframework.trx'

  integration-tests-netframework:
    name: Integration tests (NetFramework)
    runs-on: windows-latest

    steps:
      - name: Checkout (full history + tags for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            6.0.x

      - name: Setup Redis (Windows)
        run: |
          choco install memurai-developer -y
          Start-Service Memurai
          Start-Sleep -Seconds 5
          Write-Host 'Memurai started, verifying port 6379...'
          Test-NetConnection -ComputerName localhost -Port 6379

      # The Windows jobs run the net48 (RabbitMQ.Client 6.x) suites against native services, not the pinned
      # images: Memurai stands in for Redis and Chocolatey installs whatever RabbitMQ it currently ships. They
      # are therefore NOT part of the version contract; the net48 client path is validated against the pinned
      # brokers by running the same suite with Testcontainers (see DEVELOPERS.md).
      - name: Setup RabbitMQ (Windows)
        run: |
          choco install rabbitmq -y
          Start-Sleep -Seconds 15
          $rabbitPath = Get-ChildItem 'C:\Program Files\RabbitMQ Server\rabbitmq_server-*\sbin\rabbitmq-plugins.bat' | Select-Object -First 1
          & $rabbitPath enable rabbitmq_management
          Start-Sleep -Seconds 10

      - name: Restore
        run: dotnet restore Lycia.sln

      - name: Build (Release)
        run: dotnet build Lycia.sln -c Release --no-restore

      - name: Run integration tests (NetFramework)
        env:
          CI: true
          LYCIA__EVENTBUS__CONNECTIONSTRING: amqp://guest:guest@localhost:5672/
          LYCIA__EVENTSTORE__CONNECTIONSTRING: localhost:6379
        run: dotnet test tests/Lycia.IntegrationTests.NetFramework/Lycia.IntegrationTests.NetFramework.csproj -c Release --no-build --logger "trx;LogFileName=integration-netframework.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-netframework-test-results
          path: '**/integration-netframework.trx'

  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, provider-tests, compatibility-minimum, unit-tests-netframework, integration-tests-netframework]
    # Release-only: an ordinary push/merge to main must never publish NuGet packages.
    # This job only runs for a push of a release tag matching v*; a schedule or manual run never publishes.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # NuGet Trusted Publishing (https://learn.microsoft.com/nuget/nuget-org/trusted-publishing).
    # id-token: write lets this job request a GitHub OIDC token; NuGet/login exchanges it for a
    # short-lived nuget.org API key after checking it against the "lycia-release" trusted publishing
    # policy (owner gokayokutucu, repository lycia, workflow file dotnet.yml, no environment). No
    # long-lived API key secret is used. There is deliberately no `environment:` here, because the
    # policy has no environment constraint.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            6.0.x

      - name: Clear NuGet caches
        run: dotnet nuget locals all --clear

      - name: Create nuget.config with source mapping
        run: |
          cat > nuget.config <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="local" value="./artifacts/nupkgs" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local">
                <package pattern="Lycia" />
                <package pattern="Lycia.Extensions" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          XML

      - name: Restore (solution)
        run: dotnet restore Lycia.sln

      - name: Build (Release)
        run: dotnet build Lycia.sln -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Show computed version (SemVer2)
        run: |
          dotnet tool install -g nbgv || true
          nbgv get-version -v SemVer2

      # Everything is packed and validated before anything is pushed, so a failure in any package
      # stops the release before a partial set reaches nuget.org. Downstream packages resolve Lycia and
      # Lycia.Extensions from ./artifacts/nupkgs through the source mapping above, so none of them
      # needs an earlier package to be published first.
      - name: Pack Lycia
        run: dotnet pack src/Lycia/Lycia.csproj -c Release -o artifacts/nupkgs /p:ContinuousIntegrationBuild=true --no-restore

      - name: Compute exact Lycia package version
        id: package-version
        run: |
          LATEST=$(find artifacts/nupkgs -maxdepth 1 -name 'Lycia.*.nupkg' | sort -V | tail -n1)
          VER=${LATEST##*/Lycia.}
          VER=${VER%.nupkg}
          echo "Lycia package version: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Require the package version to match the release tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED="${TAG#v}"
          ACTUAL='${{ steps.package-version.outputs.version }}'
          echo "Release tag: $TAG  expected package version: $EXPECTED  packed: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: packed version $ACTUAL does not match release tag $TAG; refusing to publish."
            exit 1
          fi

      - name: Pack Lycia.Extensions (exact Lycia version)
        run: |
          dotnet restore src/Lycia.Extensions/Lycia.Extensions.csproj \
            -p:UsePackageRefForLyciaOnPack=true \
            -p:LyciaPackageVersion='${{ steps.package-version.outputs.version }}' \
            --source "./artifacts/nupkgs" --source "https://api.nuget.org/v3/index.json"
          dotnet pack src/Lycia.Extensions/Lycia.Extensions.csproj -c Release \
            -o artifacts/nupkgs \
            -p:ContinuousIntegrationBuild=true \
            -p:UsePackageRefForLyciaOnPack=true \
            -p:LyciaPackageVersion='${{ steps.package-version.outputs.version }}' \
            --no-restore

      # The persistence providers are required, not optional: AddLycia refuses to resolve ISagaStore
      # unless exactly one provider is selected, so a release without them cannot actually be used.
      - name: Pack transports, scheduling, OpenTelemetry and persistence providers (exact Lycia version)
        run: |
          for PROJECT in \
            Lycia.Extensions.RabbitMq Lycia.Extensions.Scheduling \
            Lycia.Extensions.Nats Lycia.Extensions.Kafka \
            Lycia.Extensions.OpenTelemetry Lycia.Extensions.AspNetCore \
            Lycia.Persistence.InMemory Lycia.Persistence.Redis Lycia.Persistence.SqlServer Lycia.Persistence.PostgreSql; do
            dotnet restore "src/$PROJECT/$PROJECT.csproj" \
              -p:UsePackageRefForLyciaOnPack=true \
              -p:LyciaPackageVersion='${{ steps.package-version.outputs.version }}' \
              --source "./artifacts/nupkgs" --source "https://api.nuget.org/v3/index.json"
            dotnet pack "src/$PROJECT/$PROJECT.csproj" -c Release \
              -o artifacts/nupkgs \
              -p:ContinuousIntegrationBuild=true \
              -p:UsePackageRefForLyciaOnPack=true \
              -p:LyciaPackageVersion='${{ steps.package-version.outputs.version }}' \
              --no-restore
          done

      - name: Validate all public packages before publishing
        run: |
          VER='${{ steps.package-version.outputs.version }}'
          PACKAGES="Lycia Lycia.Extensions Lycia.Extensions.RabbitMq Lycia.Extensions.Scheduling Lycia.Extensions.Nats Lycia.Extensions.Kafka Lycia.Extensions.OpenTelemetry Lycia.Extensions.AspNetCore Lycia.Persistence.InMemory Lycia.Persistence.Redis Lycia.Persistence.SqlServer Lycia.Persistence.PostgreSql"
          COUNT=$(find artifacts/nupkgs -maxdepth 1 -name '*.nupkg' | wc -l)
          echo "nupkg count: $COUNT"
          if [ "$COUNT" -ne 12 ]; then
            echo "ERROR: expected exactly 12 public packages, found $COUNT:"; ls artifacts/nupkgs; exit 1
          fi
          for PROJECT in $PACKAGES; do
            PKG="artifacts/nupkgs/$PROJECT.$VER.nupkg"
            if [ ! -f "$PKG" ]; then echo "ERROR: missing $PKG"; exit 1; fi
            echo "== $PKG"
            unzip -l "$PKG" | sed -n '1,120p'
            unzip -p "$PKG" '*.nuspec' | sed -n '1,160p'
            # No public package may depend on a project that is never published on its own.
            if unzip -p "$PKG" '*.nuspec' | grep -qE 'id="Lycia\.(Common|Saga|Saga\.Abstractions|Persistence\.Relational\.Internal|Persistence\.TestKit)"'; then
              echo "ERROR: $PROJECT declares a dependency on an internal, unpublished project."; exit 1
            fi
          done
          # The relational providers carry the internal relational implementation inside the package.
          for PROJECT in Lycia.Persistence.SqlServer Lycia.Persistence.PostgreSql; do
            if ! unzip -l "artifacts/nupkgs/$PROJECT.$VER.nupkg" | grep -q "Lycia.Persistence.Relational.Internal.dll"; then
              echo "ERROR: $PROJECT does not embed Lycia.Persistence.Relational.Internal.dll."; exit 1
            fi
          done

      # Requested only now, after everything is packed and validated: the key is valid for one hour and
      # each OIDC token can be exchanged exactly once. `user` is the nuget.org profile name that owns the
      # packages (not an email address).
      - name: NuGet login (GitHub OIDC -> short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: okutucu

      - name: Push all public packages (nuget.org)
        env:
          NUGET_TRUSTED_PUBLISHING_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          VER='${{ steps.package-version.outputs.version }}'
          for PROJECT in Lycia Lycia.Extensions Lycia.Extensions.RabbitMq Lycia.Extensions.Scheduling Lycia.Extensions.Nats Lycia.Extensions.Kafka Lycia.Extensions.OpenTelemetry Lycia.Extensions.AspNetCore Lycia.Persistence.InMemory Lycia.Persistence.Redis Lycia.Persistence.SqlServer Lycia.Persistence.PostgreSql; do
            dotnet nuget push "artifacts/nupkgs/$PROJECT.$VER.nupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_TRUSTED_PUBLISHING_KEY" \
              --skip-duplicate
          done
