name: Publish NuGet

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - 'version.json'

jobs:
  unit-tests:
    name: Unit tests (.NET Core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x
            6.0.x

      - name: Restore
        run: dotnet restore Lycia.sln

      - name: Build (Release)
        run: dotnet build Lycia.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Lycia.Tests/Lycia.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/unit.trx'

  integration-tests:
    name: Integration tests (.NET Core)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      rabbitmq:
        image: rabbitmq:3.13-management
        ports: ['5672:5672', '15672:15672']
      nats:
        image: nats:2.11-alpine
        ports: ['4222:4222', '8222:8222']
        options: >-
          --health-cmd "wget -q -O - http://localhost:8222/healthz | grep -q ok"
          --health-interval 10s --health-timeout 5s --health-retries 10
      kafka:
        image: confluentinc/cp-kafka:7.7.1
        ports: ['9092:9092']
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    steps:
      - name: Checkout (full history + tags for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x
            6.0.x

      - name: Restore
        run: dotnet restore Lycia.sln

      - name: Build (Release)
        run: dotnet build Lycia.sln -c Release --no-restore

      - name: Run integration tests
        env:
          LYCIA__EVENTBUS__CONNECTIONSTRING: amqp://guest:guest@127.0.0.1:5672/
          LYCIA__EVENTSTORE__CONNECTIONSTRING: 127.0.0.1:6379
        run: dotnet test tests/Lycia.IntegrationTests/Lycia.IntegrationTests.csproj -c Release --no-build --logger "trx;LogFileName=integration.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: '**/integration.trx'

  unit-tests-netframework:
    name: Unit tests (NetFramework)
    runs-on: windows-latest

    steps:
      - name: Checkout (full history + tags for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x
            6.0.x

      - name: Setup Redis (Windows)
        run: |
          choco install memurai-developer -y
          Start-Service Memurai
          Start-Sleep -Seconds 5

      - name: Restore
        run: dotnet restore Lycia.sln

      - name: Build (Release)
        run: dotnet build Lycia.sln -c Release --no-restore

      - name: Run unit tests (NetFramework)
        env:
          CI: true
          LYCIA__EVENTSTORE__CONNECTIONSTRING: localhost:6379
        run: dotnet test tests/Lycia.Tests.NetFramework/Lycia.Tests.NetFramework.csproj -c Release --no-build --logger "trx;LogFileName=unit-netframework.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-netframework-test-results
          path: '**/unit-netframework.trx'

  integration-tests-netframework:
    name: Integration tests (NetFramework)
    runs-on: windows-latest

    steps:
      - name: Checkout (full history + tags for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x
            6.0.x

      - name: Setup Redis (Windows)
        run: |
          choco install memurai-developer -y
          Start-Service Memurai
          Start-Sleep -Seconds 5
          Write-Host 'Memurai started, verifying port 6379...'
          Test-NetConnection -ComputerName localhost -Port 6379

      - name: Setup RabbitMQ (Windows)
        run: |
          choco install rabbitmq -y
          Start-Sleep -Seconds 15
          $rabbitPath = Get-ChildItem 'C:\Program Files\RabbitMQ Server\rabbitmq_server-*\sbin\rabbitmq-plugins.bat' | Select-Object -First 1
          & $rabbitPath enable rabbitmq_management
          Start-Sleep -Seconds 10

      - name: Restore
        run: dotnet restore Lycia.sln

      - name: Build (Release)
        run: dotnet build Lycia.sln -c Release --no-restore

      - name: Run integration tests (NetFramework)
        env:
          CI: true
          LYCIA__EVENTBUS__CONNECTIONSTRING: amqp://guest:guest@localhost:5672/
          LYCIA__EVENTSTORE__CONNECTIONSTRING: localhost:6379
        run: dotnet test tests/Lycia.IntegrationTests.NetFramework/Lycia.IntegrationTests.NetFramework.csproj -c Release --no-build --logger "trx;LogFileName=integration-netframework.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-netframework-test-results
          path: '**/integration-netframework.trx'

  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, unit-tests-netframework, integration-tests-netframework]

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x
            6.0.x

      - name: Clear NuGet caches
        run: dotnet nuget locals all --clear

      - name: Create nuget.config with source mapping
        run: |
          cat > nuget.config <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="local" value="./artifacts/nupkgs" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local">
                <package pattern="Lycia" />
                <package pattern="Lycia.Extensions" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          XML

      - name: Restore (solution)
        run: dotnet restore Lycia.sln

      - name: Build (Release)
        run: dotnet build Lycia.sln -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Show computed version (SemVer2)
        run: |
          dotnet tool install -g nbgv || true
          nbgv get-version -v SemVer2

      - name: Pack Lycia
        run: dotnet pack src/Lycia/Lycia.csproj -c Release -o artifacts/nupkgs /p:ContinuousIntegrationBuild=true --no-restore

      - name: Validate Lycia package contents
        run: |
          ls -la artifacts/nupkgs
          PKG=$(ls artifacts/nupkgs/Lycia.*.nupkg | sort -V | tail -n1)
          echo "Lycia nupkg: $PKG"
          unzip -l "$PKG" | sed -n '1,200p'

      - name: Push Lycia (nuget.org)
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/nupkgs/Lycia.*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: Compute exact Lycia package version
        id: package-version
        run: |
          LATEST=$(ls artifacts/nupkgs/Lycia.*.nupkg | sort -V | tail -n1)
          VER=${LATEST##*/Lycia.}
          VER=${VER%.nupkg}
          echo "Lycia package version: $VER"
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Restore Extensions with exact package version (pack mode)
        run: |
          dotnet restore src/Lycia.Extensions/Lycia.Extensions.csproj \
            -p:UsePackageRefForLyciaOnPack=true \
            -p:LyciaPackageVersion='${{ steps.package-version.outputs.version }}' \
            --source "./artifacts/nupkgs" --source "https://api.nuget.org/v3/index.json"

      - name: Pack Extensions (no restore)
        run: |
          dotnet pack src/Lycia.Extensions/Lycia.Extensions.csproj -c Release \
            -o artifacts/nupkgs \
            -p:ContinuousIntegrationBuild=true \
            -p:UsePackageRefForLyciaOnPack=true \
            -p:LyciaPackageVersion='${{ steps.package-version.outputs.version }}' \
            --no-restore

      - name: Validate Lycia.Extensions package contents
        run: |
          PKG=$(ls artifacts/nupkgs/Lycia.Extensions.*.nupkg | sort -V | tail -n1)
          echo "Lycia.Extensions nupkg: $PKG"
          unzip -l "$PKG" | sed -n '1,200p'
          echo "NUSPEC dependencies (should only contain Lycia):"
          unzip -p "$PKG" *.nuspec | sed -n '1,200p'

      - name: Push Lycia.Extensions (nuget.org)
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/nupkgs/Lycia.Extensions.*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: Restore RabbitMQ transport and Scheduling with exact Lycia version
        run: |
          for PROJECT in Lycia.Extensions.RabbitMq Lycia.Extensions.Scheduling; do
            dotnet restore "src/$PROJECT/$PROJECT.csproj" \
              -p:UsePackageRefForLyciaOnPack=true \
              -p:LyciaPackageVersion='${{ steps.package-version.outputs.version }}' \
              --source "./artifacts/nupkgs" --source "https://api.nuget.org/v3/index.json"
          done

      - name: Pack RabbitMQ transport and Scheduling
        run: |
          for PROJECT in Lycia.Extensions.RabbitMq Lycia.Extensions.Scheduling; do
            dotnet pack "src/$PROJECT/$PROJECT.csproj" -c Release \
              -o artifacts/nupkgs \
              -p:ContinuousIntegrationBuild=true \
              -p:UsePackageRefForLyciaOnPack=true \
              -p:LyciaPackageVersion='${{ steps.package-version.outputs.version }}' \
              --no-restore
          done

      - name: Validate RabbitMQ transport and Scheduling packages
        run: |
          for PROJECT in Lycia.Extensions.RabbitMq Lycia.Extensions.Scheduling; do
            PKG=$(ls "artifacts/nupkgs/$PROJECT".*.nupkg | sort -V | tail -n1)
            echo "$PROJECT nupkg: $PKG"
            unzip -l "$PKG" | sed -n '1,120p'
            echo "NUSPEC dependencies (should only contain Lycia and Lycia.Extensions):"
            unzip -p "$PKG" '*.nuspec' | sed -n '1,160p'
          done

      - name: Push RabbitMQ transport and Scheduling (nuget.org)
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/nupkgs/Lycia.Extensions.RabbitMq.*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          dotnet nuget push "artifacts/nupkgs/Lycia.Extensions.Scheduling.*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: Restore NATS and Kafka transports with exact Lycia version
        run: |
          for PROJECT in Lycia.Extensions.Nats Lycia.Extensions.Kafka; do
            dotnet restore "src/$PROJECT/$PROJECT.csproj" \
              -p:UsePackageRefForLyciaOnPack=true \
              -p:LyciaPackageVersion='${{ steps.package-version.outputs.version }}' \
              --source "./artifacts/nupkgs" --source "https://api.nuget.org/v3/index.json"
          done

      - name: Pack NATS and Kafka transports
        run: |
          for PROJECT in Lycia.Extensions.Nats Lycia.Extensions.Kafka; do
            dotnet pack "src/$PROJECT/$PROJECT.csproj" -c Release \
              -o artifacts/nupkgs \
              -p:ContinuousIntegrationBuild=true \
              -p:UsePackageRefForLyciaOnPack=true \
              -p:LyciaPackageVersion='${{ steps.package-version.outputs.version }}' \
              --no-restore
          done

      - name: Validate transport packages
        run: |
          for PROJECT in Lycia.Extensions.Nats Lycia.Extensions.Kafka; do
            PKG=$(ls "artifacts/nupkgs/$PROJECT".*.nupkg | sort -V | tail -n1)
            echo "$PROJECT nupkg: $PKG"
            unzip -l "$PKG" | sed -n '1,120p'
            unzip -p "$PKG" '*.nuspec' | sed -n '1,160p'
          done

      - name: Push NATS and Kafka transports (nuget.org)
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/nupkgs/Lycia.Extensions.Nats.*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          dotnet nuget push "artifacts/nupkgs/Lycia.Extensions.Kafka.*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: Restore OpenTelemetry Extensions with exact package version (pack mode)
        run: |
          dotnet restore src/Lycia.Extensions.OpenTelemetry/Lycia.Extensions.OpenTelemetry.csproj \
            -p:UsePackageRefForLyciaOnPack=true \
            -p:LyciaPackageVersion='${{ steps.package-version.outputs.version }}' \
            --source "./artifacts/nupkgs" --source "https://api.nuget.org/v3/index.json"

      - name: Pack Lycia.Extensions.OpenTelemetry (no restore)
        run: |
          dotnet pack src/Lycia.Extensions.OpenTelemetry/Lycia.Extensions.OpenTelemetry.csproj -c Release \
            -o artifacts/nupkgs \
            -p:ContinuousIntegrationBuild=true \
            -p:UsePackageRefForLyciaOnPack=true \
            -p:LyciaPackageVersion='${{ steps.package-version.outputs.version }}' \
            --no-restore

      - name: Validate Lycia.Extensions.OpenTelemetry package contents
        run: |
          PKG=$(ls artifacts/nupkgs/Lycia.Extensions.OpenTelemetry.*.nupkg | sort -V | tail -n1)
          echo "Lycia.Extensions.OpenTelemetry nupkg: $PKG"
          unzip -l "$PKG" | sed -n '1,200p'
          echo "NUSPEC dependencies (should only contain Lycia / Lycia.Extensions if applicable):"
          unzip -p "$PKG" *.nuspec | sed -n '1,200p'

      - name: Push Lycia.Extensions.OpenTelemetry (nuget.org)
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/nupkgs/Lycia.Extensions.OpenTelemetry.*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
