name: Publish NuGet

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    # Deliberately no paths filter. GitHub applies a push trigger's paths filter to tag pushes as
    # well, and a newly created tag has no meaningful diff base, so a release tag can end up not
    # building - and therefore not publishing - depending on what its commit happened to touch.
    # This workflow only fires on main pushes and v* tags, both rare enough to always warrant CI.

# Least privilege by default. Only the publish job additionally gets id-token: write, which is what
# lets it mint the GitHub OIDC token that NuGet Trusted Publishing exchanges for a short-lived key.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (.NET Core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            6.0.x

      - name: Restore
        run: dotnet restore Lycia.sln

      - name: Build (Release)
        run: dotnet build Lycia.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Lycia.Tests/Lycia.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/unit.trx'

  integration-tests:
    name: Integration tests (.NET Core)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      rabbitmq:
        image: rabbitmq:3.13-management
        ports: ['5672:5672', '15672:15672']
      nats:
        image: nats:2.11-alpine
        ports: ['4222:4222', '8222:8222']
        options: >-
          --health-cmd "wget -q -O - http://localhost:8222/healthz | grep -q ok"
          --health-interval 10s --health-timeout 5s --health-retries 10
      kafka:
        image: confluentinc/cp-kafka:7.7.1
        ports: ['9092:9092']
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    steps:
      - name: Checkout (full history + tags for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            6.0.x

      - name: Restore
        run: dotnet restore Lycia.sln

      - name: Build (Release)
        run: dotnet build Lycia.sln -c Release --no-restore

      - name: Run integration tests
        env:
          LYCIA__EVENTBUS__CONNECTIONSTRING: amqp://guest:guest@127.0.0.1:5672/
          LYCIA__EVENTSTORE__CONNECTIONSTRING: 127.0.0.1:6379
        run: dotnet test tests/Lycia.IntegrationTests/Lycia.IntegrationTests.csproj -c Release --no-build --logger "trx;LogFileName=integration.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: '**/integration.trx'

  unit-tests-netframework:
    name: Unit tests (NetFramework)
    runs-on: windows-latest

    steps:
      - name: Checkout (full history + tags for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            6.0.x

      - name: Setup Redis (Windows)
        run: |
          choco install memurai-developer -y
          Start-Service Memurai
          Start-Sleep -Seconds 5

      - name: Restore
        run: dotnet restore Lycia.sln

      - name: Build (Release)
        run: dotnet build Lycia.sln -c Release --no-restore

      - name: Run unit tests (NetFramework)
        env:
          CI: true
          LYCIA__EVENTSTORE__CONNECTIONSTRING: localhost:6379
        run: dotnet test tests/Lycia.Tests.NetFramework/Lycia.Tests.NetFramework.csproj -c Release --no-build --logger "trx;LogFileName=unit-netframework.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-netframework-test-results
          path: '**/unit-netframework.trx'

  integration-tests-netframework:
    name: Integration tests (NetFramework)
    runs-on: windows-latest

    steps:
      - name: Checkout (full history + tags for NBGV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            6.0.x

      - name: Setup Redis (Windows)
        run: |
          choco install memurai-developer -y
          Start-Service Memurai
          Start-Sleep -Seconds 5
          Write-Host 'Memurai started, verifying port 6379...'
          Test-NetConnection -ComputerName localhost -Port 6379

      - name: Setup RabbitMQ (Windows)
        run: |
          choco install rabbitmq -y
          Start-Sleep -Seconds 15
          $rabbitPath = Get-ChildItem 'C:\Program Files\RabbitMQ Server\rabbitmq_server-*\sbin\rabbitmq-plugins.bat' | Select-Object -First 1
          & $rabbitPath enable rabbitmq_management
          Start-Sleep -Seconds 10

      - name: Restore
        run: dotnet restore Lycia.sln

      - name: Build (Release)
        run: dotnet build Lycia.sln -c Release --no-restore

      - name: Run integration tests (NetFramework)
        env:
          CI: true
          LYCIA__EVENTBUS__CONNECTIONSTRING: amqp://guest:guest@localhost:5672/
          LYCIA__EVENTSTORE__CONNECTIONSTRING: localhost:6379
        run: dotnet test tests/Lycia.IntegrationTests.NetFramework/Lycia.IntegrationTests.NetFramework.csproj -c Release --no-build --logger "trx;LogFileName=integration-netframework.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-netframework-test-results
          path: '**/integration-netframework.trx'

  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, unit-tests-netframework, integration-tests-netframework]
    # Release-only: an ordinary push/merge to main must never publish NuGet packages.
    # This job only runs when the triggering ref is a release tag matching v*.
    if: startsWith(github.ref, 'refs/tags/v')
    # NuGet Trusted Publishing (https://learn.microsoft.com/nuget/nuget-org/trusted-publishing).
    # id-token: write lets this job request a GitHub OIDC token; NuGet/login exchanges it for a
    # short-lived nuget.org API key after checking it against the "lycia-release" trusted publishing
    # policy (owner gokayokutucu, repository lycia, workflow file dotnet.yml, no environment). No
    # long-lived API key secret is used. There is deliberately no `environment:` here, because the
    # policy has no environment constraint.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
            6.0.x

      - name: Clear NuGet caches
        run: dotnet nuget locals all --clear

      - name: Create nuget.config with source mapping
        run: |
          cat > nuget.config <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="local" value="./artifacts/nupkgs" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local">
                <package pattern="Lycia" />
                <package pattern="Lycia.Extensions" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          XML

      - name: Restore (solution)
        run: dotnet restore Lycia.sln

      - name: Build (Release)
        run: dotnet build Lycia.sln -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Show computed version (SemVer2)
        run: |
          dotnet tool install -g nbgv || true
          nbgv get-version -v SemVer2

      # Everything is packed and validated before anything is pushed, so a failure in any package
      # stops the release before a partial set reaches nuget.org. Downstream packages resolve Lycia and
      # Lycia.Extensions from ./artifacts/nupkgs through the source mapping above, so none of them
      # needs an earlier package to be published first.
      - name: Pack Lycia
        run: dotnet pack src/Lycia/Lycia.csproj -c Release -o artifacts/nupkgs /p:ContinuousIntegrationBuild=true --no-restore

      - name: Compute exact Lycia package version
        id: package-version
        run: |
          LATEST=$(find artifacts/nupkgs -maxdepth 1 -name 'Lycia.*.nupkg' | sort -V | tail -n1)
          VER=${LATEST##*/Lycia.}
          VER=${VER%.nupkg}
          echo "Lycia package version: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Require the package version to match the release tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED="${TAG#v}"
          ACTUAL='${{ steps.package-version.outputs.version }}'
          echo "Release tag: $TAG  expected package version: $EXPECTED  packed: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: packed version $ACTUAL does not match release tag $TAG; refusing to publish."
            exit 1
          fi

      - name: Pack Lycia.Extensions (exact Lycia version)
        run: |
          dotnet restore src/Lycia.Extensions/Lycia.Extensions.csproj \
            -p:UsePackageRefForLyciaOnPack=true \
            -p:LyciaPackageVersion='${{ steps.package-version.outputs.version }}' \
            --source "./artifacts/nupkgs" --source "https://api.nuget.org/v3/index.json"
          dotnet pack src/Lycia.Extensions/Lycia.Extensions.csproj -c Release \
            -o artifacts/nupkgs \
            -p:ContinuousIntegrationBuild=true \
            -p:UsePackageRefForLyciaOnPack=true \
            -p:LyciaPackageVersion='${{ steps.package-version.outputs.version }}' \
            --no-restore

      # The persistence providers are required, not optional: AddLycia refuses to resolve ISagaStore
      # unless exactly one provider is selected, so a release without them cannot actually be used.
      - name: Pack transports, scheduling, OpenTelemetry and persistence providers (exact Lycia version)
        run: |
          for PROJECT in \
            Lycia.Extensions.RabbitMq Lycia.Extensions.Scheduling \
            Lycia.Extensions.Nats Lycia.Extensions.Kafka \
            Lycia.Extensions.OpenTelemetry \
            Lycia.Persistence.InMemory Lycia.Persistence.Redis Lycia.Persistence.SqlServer Lycia.Persistence.PostgreSql; do
            dotnet restore "src/$PROJECT/$PROJECT.csproj" \
              -p:UsePackageRefForLyciaOnPack=true \
              -p:LyciaPackageVersion='${{ steps.package-version.outputs.version }}' \
              --source "./artifacts/nupkgs" --source "https://api.nuget.org/v3/index.json"
            dotnet pack "src/$PROJECT/$PROJECT.csproj" -c Release \
              -o artifacts/nupkgs \
              -p:ContinuousIntegrationBuild=true \
              -p:UsePackageRefForLyciaOnPack=true \
              -p:LyciaPackageVersion='${{ steps.package-version.outputs.version }}' \
              --no-restore
          done

      - name: Validate all public packages before publishing
        run: |
          VER='${{ steps.package-version.outputs.version }}'
          PACKAGES="Lycia Lycia.Extensions Lycia.Extensions.RabbitMq Lycia.Extensions.Scheduling Lycia.Extensions.Nats Lycia.Extensions.Kafka Lycia.Extensions.OpenTelemetry Lycia.Persistence.InMemory Lycia.Persistence.Redis Lycia.Persistence.SqlServer Lycia.Persistence.PostgreSql"
          COUNT=$(find artifacts/nupkgs -maxdepth 1 -name '*.nupkg' | wc -l)
          echo "nupkg count: $COUNT"
          if [ "$COUNT" -ne 11 ]; then
            echo "ERROR: expected exactly 11 public packages, found $COUNT:"; ls artifacts/nupkgs; exit 1
          fi
          for PROJECT in $PACKAGES; do
            PKG="artifacts/nupkgs/$PROJECT.$VER.nupkg"
            if [ ! -f "$PKG" ]; then echo "ERROR: missing $PKG"; exit 1; fi
            echo "== $PKG"
            unzip -l "$PKG" | sed -n '1,120p'
            unzip -p "$PKG" '*.nuspec' | sed -n '1,160p'
            # No public package may depend on a project that is never published on its own.
            if unzip -p "$PKG" '*.nuspec' | grep -qE 'id="Lycia\.(Common|Saga|Saga\.Abstractions|Persistence\.Relational\.Internal|Persistence\.TestKit)"'; then
              echo "ERROR: $PROJECT declares a dependency on an internal, unpublished project."; exit 1
            fi
          done
          # The relational providers carry the internal relational implementation inside the package.
          for PROJECT in Lycia.Persistence.SqlServer Lycia.Persistence.PostgreSql; do
            if ! unzip -l "artifacts/nupkgs/$PROJECT.$VER.nupkg" | grep -q "Lycia.Persistence.Relational.Internal.dll"; then
              echo "ERROR: $PROJECT does not embed Lycia.Persistence.Relational.Internal.dll."; exit 1
            fi
          done

      # Requested only now, after everything is packed and validated: the key is valid for one hour and
      # each OIDC token can be exchanged exactly once. `user` is the nuget.org profile name that owns the
      # packages (not an email address).
      - name: NuGet login (GitHub OIDC -> short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: okutucu

      - name: Push all public packages (nuget.org)
        env:
          NUGET_TRUSTED_PUBLISHING_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          VER='${{ steps.package-version.outputs.version }}'
          for PROJECT in Lycia Lycia.Extensions Lycia.Extensions.RabbitMq Lycia.Extensions.Scheduling Lycia.Extensions.Nats Lycia.Extensions.Kafka Lycia.Extensions.OpenTelemetry Lycia.Persistence.InMemory Lycia.Persistence.Redis Lycia.Persistence.SqlServer Lycia.Persistence.PostgreSql; do
            dotnet nuget push "artifacts/nupkgs/$PROJECT.$VER.nupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_TRUSTED_PUBLISHING_KEY" \
              --skip-duplicate
          done
